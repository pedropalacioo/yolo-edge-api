name: Edge AI - Build, Test e Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/yolo-api

jobs:
  test:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r app/requirements.txt pytest ruff "dvc[ssh]"
      - name: Recuperar modelo via DVC
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RPI_SSH_KEY }}" | tr -d '\r' > ~/.ssh/dvc_key
          chmod 600 ~/.ssh/dvc_key
          dvc remote modify --local local_remote keyfile ~/.ssh/dvc_key
          dvc pull models/yolov8n.pt.dvc dataset/exports/epi-v1.dvc
      - name: Inspecionar dataset EPI
        run: |
          python scripts/inspect_dataset.py \
            --dataset dataset/exports/epi-v1/data.yaml \
            --min-per-class 30
      - name: Disponibilizar modelo no caminho da API
        run: |
          sudo mkdir -p /app
          sudo ln -sfn "$GITHUB_WORKSPACE/models" /app/models
      - run: ruff check app/
      - run: pytest tests/ -v --tb=short

  build:
    name: Build & Push (ARM64)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  model-gate:
    name: Model Quality Gate
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ultralytics pyyaml "dvc[ssh]"
      - name: Configurar acesso ao DVC
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.RPI_SSH_KEY }}" | tr -d '\r' > ~/.ssh/dvc_key
          chmod 600 ~/.ssh/dvc_key
          dvc remote modify --local local_remote keyfile ~/.ssh/dvc_key
      - name: Recuperar e inspecionar dataset EPI
        run: |
          dvc pull dataset/exports/epi-v1.dvc
          python scripts/inspect_dataset.py \
            --dataset dataset/exports/epi-v1/data.yaml \
            --min-per-class 30
      - name: Quality gate do modelo EPI
        shell: bash
        run: |
          if [[ -f models/yolo-epi.pt.dvc ]]; then
            dvc pull models/yolo-epi.pt.dvc
            python scripts/validate_model.py \
              --model models/yolo-epi.pt \
              --dataset dataset/exports/epi-v1/data.yaml \
              --threshold 0.60
          else
            echo "::notice::Gate de mAP não executado: models/yolo-epi.pt.dvc ainda não foi fornecido."
          fi

  deploy:
    name: Deploy - Raspberry Pi 5
    needs: model-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.RPI_HOST }}
          username: ${{ secrets.RPI_USER }}
          key: ${{ secrets.RPI_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            export DEPLOY_PATH="${{ secrets.RPI_DEPLOY_PATH }}"
            cd "$DEPLOY_PATH"
            git pull origin main
            bash scripts/deploy.sh
